<svg xmlns="http://www.w3.org/2000/svg" width="1850" height="950" viewBox="0 0 1850 950" fill="none" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Streamora OTT interface preview (demo tenant)">
  <defs>
    <linearGradient id="p-app" x1="0" y1="0" x2="0" y2="950" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#15171C"/><stop offset="1" stop-color="#0E1014"/>
    </linearGradient>
    <linearGradient id="p-back" x1="600" y1="0" x2="1850" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A4A5E"/><stop offset="0.5" stop-color="#5C4A54"/><stop offset="1" stop-color="#2A3440"/>
    </linearGradient>
    <linearGradient id="p-scrim" x1="0" y1="0" x2="1250" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E1014"/><stop offset="0.42" stop-color="#0E1014" stop-opacity="0.94"/>
      <stop offset="0.75" stop-color="#0E1014" stop-opacity="0.35"/><stop offset="1" stop-color="#0E1014" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="p-scrimb" x1="0" y1="430" x2="0" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E1014" stop-opacity="0"/><stop offset="1" stop-color="#0E1014"/>
    </linearGradient>
    <linearGradient id="p-mark" x1="0" y1="0" x2="46" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C084FC"/><stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="p-sub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A855F7"/><stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="ps1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B4A8A"/><stop offset="1" stop-color="#1C1730"/></linearGradient>
    <linearGradient id="ps2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8A5A3C"/><stop offset="1" stop-color="#2B1A12"/></linearGradient>
    <linearGradient id="ps3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#37606B"/><stop offset="1" stop-color="#13242A"/></linearGradient>
    <linearGradient id="ps4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7E3B52"/><stop offset="1" stop-color="#2A121C"/></linearGradient>
    <linearGradient id="ps5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3F5B84"/><stop offset="1" stop-color="#161F2E"/></linearGradient>
    <linearGradient id="ps6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6B6437"/><stop offset="1" stop-color="#242212"/></linearGradient>
    <linearGradient id="ps7" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4A4A55"/><stop offset="1" stop-color="#17171C"/></linearGradient>
    <linearGradient id="p-pscrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.45" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.78"/>
    </linearGradient>
    <clipPath id="p-heroclip"><rect width="1850" height="620"/></clipPath>
  </defs>

  <rect width="1850" height="950" fill="url(#p-app)"/>

  <!-- Hero backdrop (abstract, non-photographic) -->
  <g clip-path="url(#p-heroclip)">
    <rect width="1850" height="620" fill="url(#p-back)"/>
    <g opacity="0.9">
      <ellipse cx="1320" cy="200" rx="360" ry="300" fill="#8FA3BC" opacity="0.42"/>
      <ellipse cx="1660" cy="400" rx="320" ry="360" fill="#A07C69" opacity="0.40"/>
      <ellipse cx="1090" cy="470" rx="290" ry="250" fill="#51657E" opacity="0.48"/>
      <path d="M1180 620 L1360 150 L1540 620 Z" fill="#FFFFFF" opacity="0.10"/>
      <path d="M1480 620 L1640 260 L1800 620 Z" fill="#FFFFFF" opacity="0.08"/>
    </g>
    <rect width="1250" height="620" fill="url(#p-scrim)"/>
    <rect y="430" width="1850" height="190" fill="url(#p-scrimb)"/>
  </g>

  <!-- Top navigation -->
  <rect width="1850" height="86" fill="#0E1014" fill-opacity="0.55"/>
  <g transform="translate(112 20)">
    <rect width="46" height="46" rx="13" fill="url(#p-mark)"/>
    <path d="M18 14 L18 32 L33 23 Z" fill="#FFFFFF"/>
  </g>
  <text x="170" y="53" font-size="27" font-weight="700" fill="#FFFFFF" letter-spacing="-0.6">Streamora</text>
  <g font-size="17" fill="#C7CBD4">
    <text x="663" y="50" fill="#FFFFFF" font-weight="600">Home</text>
    <text x="737" y="50">Movies</text>
    <text x="822" y="50">Series</text>
    <text x="900" y="50">Documentaries</text>
    <text x="1046" y="50">Live TVs</text>
    <text x="1140" y="50">Shorts</text>
  </g>
  <g transform="translate(1601 32)" stroke="#E5E7EB" stroke-width="2" fill="none">
    <circle cx="9" cy="9" r="8"/><path d="M15 15 L21 21" stroke-linecap="round"/>
  </g>
  <rect x="1663" y="24" width="104" height="38" rx="19" fill="none" stroke="#6B7280"/>
  <g transform="translate(1681 33)" stroke="#E5E7EB" stroke-width="1.8" fill="none">
    <circle cx="7" cy="6" r="4.5"/><path d="M0 19 C 0 12, 14 12, 14 19" stroke-linecap="round"/>
  </g>
  <text x="1712" y="49" font-size="15" fill="#E5E7EB">Login</text>

  <!-- Hero meta -->
  <g transform="translate(118 128)">
    <rect width="52" height="32" rx="5" fill="#101418" stroke="#3F4652"/>
    <text x="26" y="22" text-anchor="middle" font-size="14" font-weight="800" fill="#9FB2C9" letter-spacing="1.2">NW</text>
  </g>
  <text x="186" y="150" font-size="17" fill="#D8DCE4" text-decoration="underline">Drama</text>
  <text x="253" y="150" font-size="17" fill="#D8DCE4">1h 38m</text>
  <text x="348" y="150" font-size="17" fill="#D8DCE4">2024</text>
  <rect x="409" y="131" width="38" height="26" rx="5" fill="none" stroke="#6B7280"/>
  <text x="428" y="150" text-anchor="middle" font-size="14" fill="#D8DCE4">PG</text>

  <text x="118" y="248" font-size="62" font-weight="700" fill="#FFFFFF" letter-spacing="-1.4">The Silent Harbor</text>

