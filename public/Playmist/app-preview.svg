  <rect x="118" y="288" width="200" height="52" rx="26" fill="url(#p-sub)"/>
  <g transform="translate(146 302)" fill="#FFFFFF">
    <path d="M0 18 L3 4 L8 11 L12 2 L16 11 L21 4 L24 18 Z"/>
  </g>
  <text x="212" y="321" font-size="17" font-weight="600" fill="#FFFFFF">Subscribe</text>
  <rect x="333" y="288" width="128" height="52" rx="26" fill="none" stroke="#5A6270"/>
  <g transform="translate(359 302)" stroke="#FFFFFF" stroke-width="1.8" fill="none">
    <path d="M4 10 L4 20 L18 20 L21 11 L15 11 L16 3 L12 3 L8 11 Z" stroke-linejoin="round"/>
  </g>
  <text x="412" y="321" font-size="17" fill="#FFFFFF">Like</text>
  <circle cx="500" cy="314" r="26" fill="none" stroke="#5A6270"/>
  <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><path d="M500 303 V325"/><path d="M489 314 H511"/></g>
  <circle cx="562" cy="314" r="26" fill="none" stroke="#5A6270"/>
  <g stroke="#FFFFFF" stroke-width="1.8" fill="none">
    <circle cx="571" cy="306" r="4.5"/><circle cx="554" cy="314" r="4.5"/><circle cx="571" cy="322" r="4.5"/>
    <path d="M558 312 L567 308 M558 316 L567 320" stroke-linecap="round"/>
  </g>

  <text x="118" y="388" font-size="19" fill="#B6BCC7">A retired lighthouse keeper returns to a fog-bound coastal town and finds the</text>
  <text x="118" y="416" font-size="19" fill="#B6BCC7">harbour keeping a secret the tide refuses to give back.</text>
  <text x="118" y="456" font-size="17" font-weight="600" fill="#B57BF5">See More</text>
  <path d="M218 449 L228 449 L223 456 Z" fill="#B57BF5"/>

  <!-- Recommended row -->
  <text x="118" y="588" font-size="30" font-weight="700" fill="#FFFFFF" letter-spacing="-0.4">Recommended</text>

  <g>
    <g><rect x="118" y="622" width="215" height="290" rx="12" fill="url(#ps1)"/>
       <g opacity="0.30"><circle cx="226" cy="716" r="62" fill="#FFFFFF"/><path d="M140 912 L226 748 L311 912 Z" fill="#FFFFFF"/></g>
       <rect x="118" y="622" width="215" height="290" rx="12" fill="url(#p-pscrim)"/>
       <text x="226" y="884" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">HARBOR LIGHTS</text></g>

    <g><rect x="351" y="622" width="215" height="290" rx="12" fill="url(#ps2)"/>
       <g opacity="0.28"><rect x="392" y="676" width="134" height="134" rx="67" fill="#FFFFFF"/><rect x="425" y="622" width="68" height="290" fill="#FFFFFF" opacity="0.5"/></g>
       <rect x="351" y="622" width="215" height="290" rx="12" fill="url(#p-pscrim)"/>
       <text x="459" y="884" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">IRON MERIDIAN</text></g>

    <g><rect x="584" y="622" width="215" height="290" rx="12" fill="url(#ps3)"/>
       <g opacity="0.30"><path d="M584 830 L660 712 L736 830 Z" fill="#FFFFFF"/><path d="M668 862 L740 742 L799 862 Z" fill="#FFFFFF" opacity="0.7"/></g>
       <rect x="584" y="622" width="215" height="290" rx="12" fill="url(#p-pscrim)"/>
       <text x="692" y="884" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">THE LONG DUSK</text></g>

    <g><rect x="817" y="622" width="215" height="290" rx="12" fill="url(#ps4)"/>
       <g opacity="0.30"><circle cx="924" cy="730" r="70" fill="none" stroke="#FFFFFF" stroke-width="14"/><rect x="916" y="730" width="16" height="182" fill="#FFFFFF"/></g>
       <rect x="817" y="622" width="215" height="290" rx="12" fill="url(#p-pscrim)"/>
       <text x="925" y="884" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">VANTAGE</text></g>

    <g><rect x="1050" y="622" width="215" height="290" rx="12" fill="url(#ps5)"/>
       <g opacity="0.30"><circle cx="1157" cy="742" r="58" fill="#FFFFFF"/><circle cx="1157" cy="742" r="92" fill="none" stroke="#FFFFFF" stroke-width="6"/></g>
       <rect x="1050" y="622" width="215" height="290" rx="12" fill="url(#p-pscrim)"/>
       <text x="1158" y="884" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">SOLSTICE</text></g>

    <g><rect x="1283" y="622" width="215" height="290" rx="12" fill="url(#ps6)"/>
       <g opacity="0.28"><path d="M1300 880 L1360 700 L1420 880 Z" fill="#FFFFFF"/><path d="M1380 880 L1440 760 L1490 880 Z" fill="#FFFFFF" opacity="0.6"/></g>
       <rect x="1283" y="622" width="215" height="290" rx="12" fill="url(#p-pscrim)"/>
       <text x="1391" y="884" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">PAPER TIGERS</text></g>

    <g><rect x="1516" y="622" width="215" height="290" rx="12" fill="url(#ps7)"/>
       <g opacity="0.30"><circle cx="1570" cy="700" r="20" fill="#FFFFFF"/><circle cx="1624" cy="742" r="20" fill="#FFFFFF"/><circle cx="1678" cy="700" r="20" fill="#FFFFFF"/><circle cx="1597" cy="800" r="20" fill="#FFFFFF"/><circle cx="1651" cy="800" r="20" fill="#FFFFFF"/></g>
       <rect x="1516" y="622" width="215" height="290" rx="12" fill="url(#p-pscrim)"/>
       <text x="1624" y="884" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">NINE LANTERNS</text></g>
