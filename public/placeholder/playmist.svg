<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" fill="none" role="img" aria-label="Playmist — OTT Streaming Platform">
  <defs>
    <linearGradient id="pm-bg" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0614"/>
      <stop offset="0.55" stop-color="#150B28"/>
      <stop offset="1" stop-color="#1E0B33"/>
    </linearGradient>
    <radialGradient id="pm-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 130) rotate(125) scale(560 620)">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#A855F7" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pm-glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 700) rotate(-55) scale(440 480)">
      <stop offset="0" stop-color="#EC4899" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pm-mark" x1="0" y1="0" x2="72" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C084FC"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="pm-hero" x1="640" y1="300" x2="1080" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B1E63"/>
      <stop offset="1" stop-color="#1A0E2E"/>
    </linearGradient>
    <linearGradient id="pm-p1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#2E1065"/></linearGradient>
    <linearGradient id="pm-p2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DB2777"/><stop offset="1" stop-color="#4A1033"/></linearGradient>
    <linearGradient id="pm-p3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4F46E5"/><stop offset="1" stop-color="#1E1B4B"/></linearGradient>
    <linearGradient id="pm-p4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9333EA"/><stop offset="1" stop-color="#2A1147"/></linearGradient>
    <linearGradient id="pm-fade" x1="1040" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#150B28" stop-opacity="0"/>
      <stop offset="1" stop-color="#150B28" stop-opacity="0.92"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#pm-bg)"/>
  <rect width="1200" height="750" fill="url(#pm-glow)"/>
  <rect width="1200" height="750" fill="url(#pm-glow2)"/>

  <!-- Hero panel -->
  <rect x="600" y="150" width="530" height="330" rx="18" fill="url(#pm-hero)" stroke="#A855F7" stroke-opacity="0.22"/>
  <circle cx="865" cy="296" r="46" fill="#FFFFFF" fill-opacity="0.10"/>
  <circle cx="865" cy="296" r="46" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>
  <path d="M853 275 L853 317 L888 296 Z" fill="#FFFFFF" fill-opacity="0.92"/>
  <rect x="632" y="400" width="190" height="11" rx="5.5" fill="#FFFFFF" fill-opacity="0.26"/>
  <rect x="632" y="425" width="120" height="11" rx="5.5" fill="#FFFFFF" fill-opacity="0.14"/>

  <!-- Poster carousel -->
  <g>
    <rect x="600" y="520" width="150" height="200" rx="12" fill="url(#pm-p1)"/>
    <rect x="768" y="520" width="150" height="200" rx="12" fill="url(#pm-p2)"/>
    <rect x="936" y="520" width="150" height="200" rx="12" fill="url(#pm-p3)"/>
    <rect x="1104" y="520" width="150" height="200" rx="12" fill="url(#pm-p4)"/>
  </g>
  <rect x="1040" y="480" width="160" height="270" fill="url(#pm-fade)"/>

  <!-- Brand lockup -->
  <g transform="translate(88 150)">
    <rect width="72" height="72" rx="20" fill="url(#pm-mark)"/>
    <path d="M28 22 L28 50 L52 36 Z" fill="#FFFFFF"/>
  </g>
  <text x="88" y="282" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="62" font-weight="700" fill="#FFFFFF" letter-spacing="-1.5">Playmist</text>
  <text x="88" y="336" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="23" font-weight="600" fill="#C084FC" letter-spacing="0.5">OTT Streaming Platform</text>

  <rect x="88" y="372" width="64" height="4" rx="2" fill="#EC4899"/>

  <text x="88" y="432" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="#94A3B8">Live TV · Movies · Series · Shorts</text>

  <!-- Feature chips -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#E9D5FF">
    <rect x="88" y="470" width="118" height="36" rx="18" fill="#A855F7" fill-opacity="0.14" stroke="#A855F7" stroke-opacity="0.32"/>
    <text x="147" y="493" text-anchor="middle">Multi-DRM</text>
    <rect x="218" y="470" width="104" height="36" rx="18" fill="#A855F7" fill-opacity="0.14" stroke="#A855F7" stroke-opacity="0.32"/>
    <text x="270" y="493" text-anchor="middle">4K HDR</text>
    <rect x="334" y="470" width="132" height="36" rx="18" fill="#A855F7" fill-opacity="0.14" stroke="#A855F7" stroke-opacity="0.32"/>
    <text x="400" y="493" text-anchor="middle">Low Latency</text>
  </g>
</svg>
